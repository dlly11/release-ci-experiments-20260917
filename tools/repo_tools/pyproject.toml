[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monorepo-repo-tools"
version = "0.1.0"
description = "Private maintenance commands for this repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = ["Private :: Do Not Upload"]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
repo-tools = "repo_tools.cli:main"

[[project.authors]]
name = "Release CI Experiment"
email = "release-lab@example.com"

[project.urls]
Repository = "https://github.com/dlly11/release-ci-experiments-20260917"
Documentation = "https://dlly11.github.io/release-ci-experiments-20260917/"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_tools = ["py.typed"]

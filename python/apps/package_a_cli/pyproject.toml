[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "release-lab-package-a-cli"
version = "0.2.1"
description = "Example CLI application consuming release-lab-package-a."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["release-lab-package-a>=0.1.0"]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
release-lab-package-a-cli = "release_lab_package_a_cli.cli:main"

[[project.authors]]
name = "Release CI Experiment"
email = "release-lab@example.com"

[project.urls]
Repository = "https://github.com/dlly11/release-ci-experiments-20260917"
Documentation = "https://dlly11.github.io/release-ci-experiments-20260917/"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
release_lab_package_a_cli = ["py.typed"]

name: Lab explicit check publisher
on:
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish only checks backed by successful exact-head workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from urllib.parse import urlencode
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo == 'dlly11/release-ci-experiments-20260917'
          def api(path, data=None):
              args=['gh','api',f'repos/{repo}/{path}']
              if data is not None:
                  args += ['--method','POST','--input','-']
              return json.loads(subprocess.check_output(args,input=json.dumps(data) if data is not None else None,text=True))
          pr=api(f'pulls/{int(os.environ["PR_NUMBER"])}')
          assert pr['state']=='open' and pr['base']['ref']=='probes'
          assert pr['head']['repo']['full_name']==repo
          sha=pr['head']['sha']
          merge_sha=pr['merge_commit_sha']
          assert api(f'git/commits/{merge_sha}')["tree"]["sha"] == api(f'git/commits/{sha}')["tree"]["sha"]
          for workflow,name in [('ci.yml','CI result'),('pr-title.yml','Conventional PR title')]:
              runs=api(f'actions/workflows/{workflow}/runs?'+urlencode({'head_sha':sha,'event':'workflow_dispatch','per_page':100}))['workflow_runs']
              run=max(runs,key=lambda item:item['id'])
              assert run['head_sha']==sha and run['conclusion']=='success' and run['status']=='completed'
              jobs=api(f'actions/runs/{run["id"]}/jobs')['jobs']
              assert len(jobs)==1 and jobs[0]['name']==name and jobs[0]['conclusion']=='success'
              assert api(f'pulls/{pr["number"]}')['head']['sha']==sha
              check=api(f'statuses/{sha}',{'context':name,'state':'success','target_url':run['html_url'],'description':f'Exact-head sandbox validation {run["id"]}'})
              print(json.dumps({'check':check['id'],'name':name,'head':sha,'backing_run':run['id']}))
          PY

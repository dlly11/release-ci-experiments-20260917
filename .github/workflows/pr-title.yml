name: PR title

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to validate on the selected branch
        required: true
        type: string

concurrency:
  group: pr-title-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate the current pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/repo_tools/run.py check-pr-title --pr "${PR_NUMBER}" --expected-head "${EXPECTED_HEAD}"

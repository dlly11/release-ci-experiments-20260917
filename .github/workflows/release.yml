name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery-run-id:
        description: Successful fresh manual CI run on current main (only for evidence recovery)
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Create GitHub release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
      # Release Please comments on the merged PR after creating its release.
      pull-requests: write
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check out release gate from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful merged PR verification for current main
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/repo_tools/run.py check-release-readiness
      - name: Validate release automation configuration
        if: steps.readiness.outputs.ready == 'true'
        id: automation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTH_MODE: ${{ vars.RELEASE_AUTH_MODE }}
          RELEASE_AUTO_MERGE: ${{ vars.RELEASE_AUTO_MERGE }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: python tools/repo_tools/run.py check-release-automation
      - name: Create repository-scoped release App token
        if: steps.automation.outputs.auth-mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Run Release Please
        if: steps.readiness.outputs.ready == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: &release-token ${{ (steps.automation.outputs.auth-mode == 'app' && steps.app-token.outputs.token) || (steps.automation.outputs.auth-mode == 'pat' && secrets.RELEASE_PAT) || (steps.automation.outputs.auth-mode == 'github-token' && github.token) }}
          target-branch: main
          config-file: tools/release-please/config.json
          manifest-file: tools/release-please/manifest.json
          skip-github-pull-request: true

  prepare-release-pr:
    name: Prepare release PR
    needs: release-please
    if: needs.release-please.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out release gate from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful merged PR verification for current main
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/repo_tools/run.py check-release-readiness
      - name: Validate release automation configuration
        if: steps.readiness.outputs.ready == 'true'
        id: automation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTH_MODE: ${{ vars.RELEASE_AUTH_MODE }}
          RELEASE_AUTO_MERGE: ${{ vars.RELEASE_AUTO_MERGE }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: python tools/repo_tools/run.py check-release-automation
      - name: Create repository-scoped release App token
        if: steps.automation.outputs.auth-mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Open or update release PR
        if: steps.readiness.outputs.ready == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: *release-token
          target-branch: main
          config-file: tools/release-please/config.json
          manifest-file: tools/release-please/manifest.json
          skip-github-release: true

      # Release Please updates the declared versions, but uv.lock is generated by uv. Refresh the
      # lockfile on the managed release branch, then dispatch authoritative CI in every
      # credential mode. Automatic release PR CI delegates to that synchronized run.
      - name: Read the release pull request
        if: steps.release.outputs.prs_created == 'true'
        id: release-pr
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          echo "branch=$(jq -r '.headBranchName' <<< "${RELEASE_PR}")" >> "${GITHUB_OUTPUT}"
          echo "number=$(jq -r '.number' <<< "${RELEASE_PR}")" >> "${GITHUB_OUTPUT}"

      - name: Check out the release pull request
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release-pr.outputs.branch }}
          token: *release-token

      - name: Install uv
        if: steps.release.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Refresh and verify the workspace lockfile
        if: steps.release.outputs.prs_created == 'true'
        run: |
          uv lock
          python tools/repo_tools/run.py check-versions

      - name: Commit the refreshed lockfile
        if: steps.release.outputs.prs_created == 'true'
        id: release-head
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize release lockfile"
            git push origin "HEAD:${RELEASE_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Dispatch authoritative release PR validation
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_HEAD: ${{ steps.release-head.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "${RELEASE_BRANCH}" -f "release-pr-number=${RELEASE_PR_NUMBER}" -f "expected-head=${RELEASE_HEAD}"
          gh workflow run pr-title.yml --ref "${RELEASE_BRANCH}" -f "pr-number=${RELEASE_PR_NUMBER}"

      - name: Validate the synchronized release PR for auto-merge
        if: steps.release.outputs.prs_created == 'true' && steps.automation.outputs.auto-merge == 'true'
        id: merge-eligibility
        env:
          GH_TOKEN: *release-token
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_HEAD: ${{ steps.release-head.outputs.sha }}
        run: >-
          python tools/repo_tools/run.py check-release-automation
          --pr "${RELEASE_PR_NUMBER}" --branch "${RELEASE_BRANCH}" --expected-head "${RELEASE_HEAD}"

      - name: Enable release PR auto-merge after required checks and reviews
        if: steps.release.outputs.prs_created == 'true' && steps.automation.outputs.auto-merge == 'true'
        env:
          GH_TOKEN: *release-token
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_HEAD: ${{ steps.release-head.outputs.sha }}
          RELEASE_TITLE: ${{ steps.merge-eligibility.outputs.title }}
        run: >-
          gh pr merge "${RELEASE_PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
          --auto --squash --match-head-commit "${RELEASE_HEAD}" --subject "${RELEASE_TITLE}"

  python-assets:
    name: Publish Python assets
    if: needs.release-please.outputs.release-created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag-name }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Verify the release version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: python tools/repo_tools/run.py check-versions --tag "${RELEASE_TAG}"
      - name: Build every Python distribution
        run: uv build --all-packages --out-dir dist
      - name: Smoke-test the release wheels
        run: python tools/repo_tools/run.py check-python-install --dist dist
      - name: Attach Python distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber

  native-assets:
    name: Publish native asset (${{ matrix.os }})
    if: needs.release-please.outputs.release-created == 'true'
    needs: release-please
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: gcc
            cxx: g++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag-name }}
      - name: Verify the release version
        run: python tools/repo_tools/run.py check-versions --tag "${RELEASE_TAG}"
      - name: Build and install the native components
        run: |
          cmake --preset release
          cmake --build --preset release
          cmake --install build/release --prefix stage
          python tools/repo_tools/run.py check-native-install stage
          cmake -S native/tests/install_consumer -B build/release-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONOREPO_INSTALL_PREFIX="${{ github.workspace }}/stage"
          cmake --build build/release-consumer
          ctest --test-dir build/release-consumer --output-on-failure
          cmake -E make_directory dist
      - name: Create the native archive
        env:
          ARCHIVE: ${{ github.event.repository.name }}-${{ needs.release-please.outputs.tag-name }}-${{ runner.os }}-${{ runner.arch }}.zip
        run: cmake -E tar cf "../dist/${ARCHIVE}" --format=zip .
        working-directory: stage
      - name: Attach the native archive to the GitHub release
        env:
          ARCHIVE: ${{ github.event.repository.name }}-${{ needs.release-please.outputs.tag-name }}-${{ runner.os }}-${{ runner.arch }}.zip
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "dist/${ARCHIVE}" --clobber


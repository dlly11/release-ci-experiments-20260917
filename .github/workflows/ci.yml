name: CI
on:
  push:
    branches: [probes]
  pull_request:
    branches: [probes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record exact event and fail when requested
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          print(json.dumps({key: os.environ[key] for key in ("GITHUB_EVENT_NAME", "GITHUB_SHA", "GITHUB_REF", "GITHUB_ACTOR")}))
          assert "FAIL" not in Path("lab-probe.txt").read_text()
          PYTHON
